// README top: four real sheets, slightly overlapping, nothing drawn but the markers and boxes.
// Every crop edge falls in a blank gap of its page, and sheets overlap only on blank paper:
// the two upper sheets lie on top, so their clean bottom edges and shadows fall on the lower ones.
//   upper left   SEC order, page 1, title block
//   upper right  US 7,587,347 B2, front page (title, inventors Kenneth C. Griffin and Matthew Andresen,
//                assignee Citadel Investment Group); the box here frames the (75) Inventors lines only,
//                because this crop ends 9 px under the assignee block
//   lower left   SEC order, page 4, paragraphs 9-11 (FastFill, $10.01 vs $10.00)
//   lower right  SEC order, page 11, Section V (disgorgement, interest, penalty)
renderFigure({
  layout: 'abs',
  size: [1600, 900],
  sheets: [{
    page: 1, clip: [0, 84, 612, 434], width: 780, at: [46, 64], rot: -0.6, z: 3,
    marks: ['Release No. 10280 / January 13, 2017', 'Release No. 79790 / January 13, 2017', 'File No. 3-17772', 'Citadel Securities LLC'],
    boxes: [{ p: 'Citadel Securities LLC', padx: 2.5, pady: 1.5 }],
  }, {
    src: 'pages/patent_front.png', natural: [1600, 1278], clip: [160, 22, 1420, 635], width: 740, at: [812, 52], rot: 0.5, z: 4,
    marks: window.PATENT_MARKS,
    boxes: [{ x0: 256, y0: 481, x1: 755, y1: 547 }],
  }, {
    page: 4, clip: [0, 88, 612, 334], width: 800, at: [50, 502], rot: 0.4, z: 1,
    marks: ['For example, if CES was handling a marketable order to buy shares, and the SIP best offer was $10.01, and the best offer from one or more of the depth of book feeds was $10.00, FastFill immediately internalized the order using the SIP offer of $10.01 per share. FastFill did not internalize at or seek to obtain through routing the better $10.00 price from the depth of book feeds.'],
    boxes: [{ p: '$10.01,', nth: 0 }, { p: '$10.00,', nth: 0 }],
  }, {
    page: 11, clip: [0, 172, 612, 478], width: 760, at: [804, 407], rot: -0.4, z: 2,
    marks: ['pay disgorgement of $5,200,000, prejudgment interest of $1,465,268, and a civil money penalty of $16,000,000'],
    boxes: [{ p: '$5,200,000,' }, { p: '$1,465,268,' }, { p: '$16,000,000' }],
  }],
});
